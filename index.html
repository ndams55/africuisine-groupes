<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AfriCuisine — Groupes ethnoculturels</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --paper: #fffdf9;
      --ink: #1c1915;
      --muted: #5e584f;
      --line: #e4ddd2;
      --accent: #8c3d2a;
      --accent-soft: #f3e6e1;
      --bar: #8c3d2a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    }
    main { max-width: 1240px; margin: 0 auto; padding: 40px 20px 80px; }
    h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
    h2 { font-size: 1.25rem; margin: 0 0 12px; }
    p { margin: 0; }
    .lede { color: var(--muted); max-width: 68ch; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 28px 0; }
    .stat { background: var(--paper); border: 1px solid var(--line); padding: 14px 16px; }
    .stat b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 0.85rem; }
    section { margin-top: 36px; }
    .note { background: var(--accent-soft); border: 1px solid #e4cfc7; padding: 12px 14px; margin-top: 16px; font-size: 0.95rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    label { font-size: 0.85rem; color: var(--muted); }
    select, input[type="search"] {
      font: inherit;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 8px 10px;
      min-width: 220px;
    }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
    button.pill {
      font: inherit;
      font-size: 0.9rem;
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 6px 10px;
      cursor: pointer;
      color: var(--ink);
    }
    button.pill[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    table { width: 100%; border-collapse: collapse; background: var(--paper); font-size: 0.95rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    tr:hover td { background: #faf7f2; }
    .bar-cell { width: 28%; }
    .bar { height: 8px; background: var(--bar); }
    .caption { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
    .scroll { overflow-x: auto; border: 1px solid var(--line); }
    .rules-scroll { overflow: auto; border: 1px solid var(--line); }
    .rules-scroll thead th { position: sticky; top: 0; background: var(--paper); z-index: 1; }
    .compare-scroll { margin-top: 12px; }
    .compare-row { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
    @media (min-width: 1100px) {
      .compare-row { grid-template-columns: minmax(380px, 0.9fr) minmax(520px, 1.15fr); }
    }
    .share-chart { margin: 0; background: var(--paper); border: 1px solid var(--line); padding: 14px 16px 10px; }
    .share-row, .share-axis { display: grid; grid-template-columns: 118px minmax(180px, 1fr) 44px; gap: 8px; align-items: center; }
    .share-row { margin: 4px 0; font-size: 0.88rem; }
    .share-name { white-space: nowrap; }
    .share-track { height: 16px; background: #efeae3; }
    .share-fill { display: block; height: 100%; background: #3c7ea6; }
    .share-value { font-variant-numeric: tabular-nums; text-align: right; }
    .share-axis { margin-top: 6px; color: var(--muted); font-size: 0.75rem; }
    .share-scale { display: flex; justify-content: space-between; }
    .compare-table { min-width: 0; }
    .top { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; }
    .lang { display: flex; gap: 8px; flex: none; }
    @media (max-width: 800px) {
      .stats { grid-template-columns: 1fr 1fr; }
      h1 { font-size: 1.6rem; }
      .bar-cell { display: none; }
      .top { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div>
        <h1 id="title"></h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" class="pill" id="lang-fr">Français</button>
        <button type="button" class="pill" id="lang-en">English</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="note" id="method"></div>

    <section id="rules-section">
      <h2 id="rules-title"></h2>
      <div class="rules-scroll" id="rules-wrap"><table id="rules"></table></div>
      <p class="caption" id="rules-caption"></p>
    </section>

    <section>
      <h2 id="detail-title"></h2>
      <div class="controls">
        <label><span id="country-label"></span><br><select id="country"></select></label>
        <label><span id="query-label"></span><br><input id="query" type="search"></label>
      </div>
      <div class="pills" id="files"></div>
      <p class="caption" id="selection-meta"></p>
      <div class="scroll"><table id="groups"></table></div>
    </section>

    <section>
      <h2 id="compare-title"></h2>
      <p class="lede" id="compare-lede"></p>
      <div class="compare-scroll">
        <div class="compare-row">
          <figure class="share-chart">
            <div id="share-chart"></div>
            <p class="caption" id="share-caption"></p>
          </figure>
          <div class="scroll compare-table"><table id="overview"></table></div>
        </div>
      </div>
    </section>
  </main>

        rulesCaption: "Le libellé retenu est celui fixé pour chaque regroupement.",
        rulesHeaders: ["Pays", "Forme d’origine", "Libellé retenu"],
        detailTitle: "Détail d’un pays",
        country: "Pays",
        filter: "Filtrer un libellé",
        placeholder: "Fon, Yoruba…",
        allFiles: "Tous les fichiers",
        copy: "copie",
        raw: "brut",
        metaAll: (dishes, labels) => `${dishes} plats · ${labels} libellés · copies identiques exclues`,
        metaFile: (file, sheet, dishes) => `${file} · ${sheet} · ${dishes} plats`,
        groupHeaders: ["Groupe", "Exemples", "Part des plats", ""],
        none: "Aucun libellé ne correspond.",
        compareTitle: "Comparaison des pays",
        compareLede: "Chaque pays additionne ses fichiers de langue. Ghana et le Kenya ne comptent pas deux fois leur copie identique.",
        shareCaption: "Part du libellé le plus fréquent. Axe des catégories : pays. Axe des valeurs : pourcentage des plats du pays.",
        compareHeaders: ["Pays", "Plats", "Libellés", "Libellé le plus fréquent", "Exemples", "Part"],
      },
      en: {
        title: "Ethnocultural groups by country",
        pageTitle: "AfriCuisine — Ethnocultural groups",
        lede: "Column “Social / ethnocultural group association”. One example is one dish row. A label is renamed only when the whole cell matches, and only in the country named in the rule.",
        countries: "Countries",
        dishes: "Dishes, identical copies counted once",
        files: (n) => `Files counted, out of ${n} sheets`,
        empty: "Empty cells in this column",
        method: "Ghana: Ewe is the same sheet as Twi. Kenya: Kalenjin is the same sheet as Luo. Those copies are not added twice. Senegal, Sudan, and Burkina Faso are not in this count.",
        rulesTitle: "Harmonizations",
        rulesCaption: "The kept label is the one set for each grouping.",
        rulesHeaders: ["Country", "Original form", "Kept label"],
        detailTitle: "Country detail",
        country: "Country",
        filter: "Filter a label",
        placeholder: "Fon, Yoruba…",
        allFiles: "All files",
        copy: "copy",
        raw: "raw",
        metaAll: (dishes, labels) => `${dishes} dishes · ${labels} labels · identical copies excluded`,
        metaFile: (file, sheet, dishes) => `${file} · ${sheet} · ${dishes} dishes`,
        groupHeaders: ["Group", "Examples", "Share of dishes", ""],
        none: "No label matches this filter.",
        compareTitle: "Country comparison",
        compareLede: "Each country adds up its language files. Ghana and Kenya do not count their identical copy twice.",
        shareCaption: "Share of the most frequent label. Categories: country. Values: percent of that country’s dishes.",
        compareHeaders: ["Country", "Dishes", "Labels", "Most frequent label", "Examples", "Share"],
      },
    };

    const countrySelect = document.querySelector("#country");
    const queryInput = document.querySelector("#query");
    const filesEl = document.querySelector("#files");
    let fileId = "all";
    let lang = "fr";
    try { if (localStorage.getItem("africuisine-lang") === "en") lang = "en"; } catch (error) { lang = "fr"; }
    const t = () => TEXT[lang];
    function displayCountry(country) {
      if (lang === "en" && country.id === "somalie") return "Somalia";
      return country.name;
    }

    function keptFiles(country) {
      return country.files.filter((file) => !file.duplicateOf);
    }
    function canonical(countryId, name) {
      const rule = RULES.find((item) => item.countryId === countryId && item.from === name);
      return rule ? rule.to : name;
    }
    function merge(countryId, files) {
      const counts = new Map();
      let dishes = 0;
      for (const file of files) {
        dishes += file.dishes;
        for (const group of file.groups) {
          const name = canonical(countryId, group.name);
          counts.set(name, (counts.get(name) || 0) + group.count);
        }
      }
      const groups = [...counts.entries()]
        .map(([name, count]) => ({ name, count }))
        .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, lang));
      return { dishes, groups };
    }
    function pct(count, total) {
      if (!total) return "0%";
      return Math.round((100 * count) / total) + "%";
    }
    function table(headers, rows, numeric) {
      const thead = "<thead><tr>" + headers.map((h, i) => `<th class="${numeric.includes(i) ? "num" : ""}">${h}</th>`).join("") + "</tr></thead>";
      const body = rows.map((row) => "<tr>" + row.map((cell, i) => `<td class="${numeric.includes(i) ? "num" : ""}">${cell}</td>`).join("") + "</tr>").join("");
      return thead + "<tbody>" + (body || `<tr><td colspan="${headers.length}">${t().none}</td></tr>`) + "</tbody>";
    }
    function currentCountry() {
      return COUNTRIES.find((item) => item.id === countrySelect.value) || COUNTRIES[0];
    }
    function selectionOf(country) {
      if (fileId === "all" || !country.files.some((file) => file.id === fileId)) {
        return merge(country.id, keptFiles(country));
      }
      const file = country.files.find((item) => item.id === fileId);
      return merge(country.id, [file]);
    }

    const overview = COUNTRIES.map((country) => {
      const totals = merge(country.id, keptFiles(country));
      const top = totals.groups[0];
      return {
        name: country.name,
        dishes: totals.dishes,
        labels: totals.groups.length,
        topName: top ? top.name : "",
        topCount: top ? top.count : 0,
        share: totals.dishes ? Math.round((100 * top.count) / totals.dishes) : 0,
      };
    }).sort((a, b) => b.dishes - a.dishes || a.name.localeCompare(b.name, lang));

    const totalDishes = overview.reduce((sum, item) => sum + item.dishes, 0);
    const sheetCount = COUNTRIES.reduce((sum, item) => sum + item.files.length, 0);
    const countedFiles = COUNTRIES.reduce((sum, item) => sum + keptFiles(item).length, 0);

    function paintChrome() {
      const copy = t();
      document.documentElement.lang = lang;
      document.title = copy.pageTitle;
      document.querySelector("#title").textContent = copy.title;
      document.querySelector("#lede").textContent = copy.lede;
      document.querySelector("#lang-fr").setAttribute("aria-pressed", String(lang === "fr"));
      document.querySelector("#lang-en").setAttribute("aria-pressed", String(lang === "en"));
      document.querySelector("#stats").innerHTML = [
        [String(COUNTRIES.length), copy.countries],
        [String(totalDishes), copy.dishes],
        [String(countedFiles), copy.files(sheetCount)],
        ["0", copy.empty],
      ].map(([value, label]) => `<div class="stat"><b>${value}</b><span>${label}</span></div>`).join("");
      document.querySelector("#method").textContent = copy.method;
      document.querySelector("#rules-section").hidden = RULES.length === 0;
      document.querySelector("#rules-title").textContent = copy.rulesTitle;
      document.querySelector("#rules-caption").textContent = copy.rulesCaption;
      document.querySelector("#detail-title").textContent = copy.detailTitle;
      document.querySelector("#country-label").textContent = copy.country;
      document.querySelector("#query-label").textContent = copy.filter;
      queryInput.placeholder = copy.placeholder;
      document.querySelector("#compare-title").textContent = copy.compareTitle;
      document.querySelector("#compare-lede").textContent = copy.compareLede;
      document.querySelector("#share-caption").textContent = copy.shareCaption;
      const byShare = [...overview].sort((a, b) => b.share - a.share || a.name.localeCompare(b.name, lang));
      document.querySelector("#share-chart").innerHTML = byShare.map((item) => {
        const country = COUNTRIES.find((entry) => entry.name === item.name);
        const name = country ? displayCountry(country) : item.name;
        return `<div class="share-row"><span class="share-name">${name}</span><span class="share-track"><span class="share-fill" style="width:${item.share}%"></span></span><span class="share-value">${item.share}%</span></div>`;
      }).join("") + `<div class="share-axis" aria-hidden="true"><span></span><span class="share-scale"><span>0%</span><span>50%</span><span>100%</span></span><span></span></div>`;
      const selectedId = countrySelect.value;
      countrySelect.innerHTML = COUNTRIES.map((country) => `<option value="${country.id}">${displayCountry(country)}</option>`).join("");
      countrySelect.value = selectedId || "benin";
      const rulesTable = document.querySelector("#rules");
      const rulesWrap = document.querySelector("#rules-wrap");
      rulesTable.innerHTML = table(
        copy.rulesHeaders,
        RULES.map((rule) => {
          const country = COUNTRIES.find((item) => item.id === rule.countryId);
          return [country ? displayCountry(country) : rule.countryId, rule.from, rule.to];
        }),
        []
      );
      const ruleRows = rulesTable.querySelectorAll("tbody tr");
      if (ruleRows.length > 10) {
        const top = rulesTable.getBoundingClientRect().top;
        const cut = ruleRows[10].getBoundingClientRect().top;
        rulesWrap.style.maxHeight = `${Math.ceil(cut - top)}px`;
      } else {
        rulesWrap.style.maxHeight = "";
      }
      document.querySelector("#overview").innerHTML = table(
        copy.compareHeaders,
        overview.map((item) => {
          const country = COUNTRIES.find((entry) => entry.name === item.name);
          return [country ? displayCountry(country) : item.name, String(item.dishes), String(item.labels), item.topName, String(item.topCount), item.share + "%"];
        }),
        [1, 2, 4, 5]
      );
    }

    function render() {
      const country = currentCountry();
      if (fileId !== "all" && !country.files.some((file) => file.id === fileId)) fileId = "all";
      const selected = selectionOf(country);
      const needle = queryInput.value.trim().toLowerCase();
      const groups = needle ? selected.groups.filter((group) => group.name.toLowerCase().includes(needle)) : selected.groups;
      const max = groups.reduce((n, group) => Math.max(n, group.count), 0) || 1;

      filesEl.innerHTML = "";
      if (country.files.length > 1) {
        const buttons = [{ id: "all", label: t().allFiles }].concat(country.files.map((file) => ({
          id: file.id,
          label: file.duplicateOf ? `${file.label} (${t().copy})` : file.raw ? `${file.label} (${t().raw})` : file.label,
        })));
        for (const button of buttons) {
          const el = document.createElement("button");
          el.className = "pill";
          el.type = "button";
          el.textContent = button.label;
          el.setAttribute("aria-pressed", String(fileId === button.id));
          el.addEventListener("click", () => { fileId = button.id; render(); });
          filesEl.appendChild(el);
        }
      }

      const active = country.files.find((file) => file.id === fileId);
      document.querySelector("#selection-meta").textContent = fileId === "all"
        ? t().metaAll(selected.dishes, selected.groups.length)
        : t().metaFile(active.file, active.sheet, selected.dishes);

      document.querySelector("#groups").innerHTML = table(
        t().groupHeaders,
        groups.map((group) => [
          group.name,
          String(group.count),
          pct(group.count, selected.dishes),
          `<div class="bar" style="width:${Math.round((100 * group.count) / max)}%"></div>`,
        ]),
        [1, 2]
      );
    }

    function setLang(next) {
      lang = next;
      try { localStorage.setItem("africuisine-lang", next); } catch (error) { /* private mode */ }
      paintChrome();
      render();
    }
    document.querySelector("#lang-fr").addEventListener("click", () => setLang("fr"));
    document.querySelector("#lang-en").addEventListener("click", () => setLang("en"));
    countrySelect.addEventListener("change", () => { fileId = "all"; render(); });
    queryInput.addEventListener("input", render);
    paintChrome();
    render();
  </script>
</body>
</html>
